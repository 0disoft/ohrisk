name: Finalize semantic finding fingerprints

on:
  push:
    branches:
      - fix/semantic-finding-fingerprints

permissions:
  contents: write

concurrency:
  group: agent-semantic-finding-fingerprints
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Normalize changed sources
        shell: python
        run: |
          from pathlib import Path

          for file_name in (
              "src/policy/finding-id.ts",
              "src/policy/evaluate.ts",
              "test/finding-id.test.ts",
          ):
              path = Path(file_name)
              lines = path.read_text(encoding="utf-8").splitlines()
              path.write_text("\n".join(line.rstrip() for line in lines) + "\n", encoding="utf-8")

          Path("agent-verification.txt").unlink(missing_ok=True)
          Path("agent-finalize.txt").unlink(missing_ok=True)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release gate
        shell: bash
        run: |
          set +e
          bun run verify:release 2>&1 | tee agent-finalize.txt
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-finalize.txt
          exit "$status"

      - name: Persist failed diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🤖 chore: capture final semantic fingerprint diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Commit verified change
        if: success()
        run: |
          rm .github/workflows/agent-semantic-fingerprints.yml
          rm -f agent-finalize.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🛡️ fix: make finding fingerprints semantic" -m "Stop diff identity from changing when explanatory prose is edited. Fingerprints now encode normalized license semantics, source provenance, severity, and recommendation using deterministic set ordering." -m "Validation: bun run verify:release"
          git push origin "HEAD:${GITHUB_REF_NAME}"
