name: Apply semantic finding fingerprints

on:
  push:
    branches:
      - fix/semantic-finding-fingerprints

permissions:
  contents: write

concurrency:
  group: agent-semantic-finding-fingerprints
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Make fingerprints semantic
        shell: python
        run: |
          from pathlib import Path

          def replace_once(file_name: str, old: str, new: str) -> None:
              path = Path(file_name)
              source = path.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"expected one replacement anchor in {file_name}, found {source.count(old)}")
              path.write_text(source.replace(old, new), encoding="utf-8")

          replace_once(
              "src/policy/finding-id.ts",
              'import type { RiskFinding } from "./types";\n',
              'import type { NormalizedLicense } from "../license/types";\nimport type { RiskFinding } from "./types";\n'
          )

          replace_once(
              "src/policy/finding-id.ts",
              '''export function buildFindingFingerprint(input: {
            id: string;
            severity: RiskFinding["severity"];
            recommendation: RiskFinding["recommendation"];
            reason: string;
            evidence: string[];
          }): string {
            return [
              input.id,
              encodeFindingComponent(input.severity),
              encodeFindingComponent(input.recommendation),
              encodeFindingComponent(input.reason),
              input.evidence.map(encodeFindingComponent).join("|")
            ].join("::");
          }
          ''',
              '''export function buildFindingFingerprint(input: {
            id: string;
            severity: RiskFinding["severity"];
            recommendation: RiskFinding["recommendation"];
            license: Pick<
              NormalizedLicense,
              | "expression"
              | "choices"
              | "joiner"
              | "signals"
              | "evidenceSources"
              | "confidence"
              | "exceptions"
            >;
          }): string {
            const semanticLicense = JSON.stringify({
              expression: input.license.expression ?? null,
              choices: canonicalStringSet(input.license.choices),
              joiner: input.license.joiner,
              signals: canonicalStringSet(input.license.signals),
              evidenceSources: canonicalStringSet(input.license.evidenceSources),
              confidence: input.license.confidence,
              exceptions: canonicalStringSet(input.license.exceptions ?? [])
            });

            return [
              input.id,
              encodeFindingComponent(input.severity),
              encodeFindingComponent(input.recommendation),
              encodeFindingComponent(semanticLicense)
            ].join("::");
          }

          function canonicalStringSet(values: readonly string[]): string[] {
            return [...new Set(values)].sort(compareStrings);
          }

          function compareStrings(left: string, right: string): number {
            if (left < right) {
              return -1;
            }
            if (left > right) {
              return 1;
            }
            return 0;
          }
          '''
          )

          replace_once(
              "src/policy/evaluate.ts",
              '''    fingerprint: buildFindingFingerprint({
                id,
                severity,
                recommendation,
                reason,
                evidence
              }),
          ''',
              '''    fingerprint: buildFindingFingerprint({
                id,
                severity,
                recommendation,
                license: input.license
              }),
          '''
          )

          replace_once(
              "test/finding-id.test.ts",
              '''  test("escapes fingerprint delimiters inside reason and evidence components", () => {
            const fingerprint = buildFindingFingerprint({
              id: "package@1.0.0::production::direct::root>package@1.0.0",
              severity: "high",
              recommendation: "replace",
              reason: "reason::with>delimiters",
              evidence: ["license: MIT | Apache-2.0", "path > LICENSE"]
            });

            expect(
              fingerprint.startsWith("package@1.0.0::production::direct::root>package@1.0.0::high::replace::")
            ).toBe(true);
            expect(fingerprint).toContain("reason%3A%3Awith%3Edelimiters");
            expect(fingerprint).toContain("license%3A MIT %7C Apache-2.0");
            expect(fingerprint).toContain("path %3E LICENSE");
          });
          ''',
              '''  test("canonicalizes unordered semantic license facts in finding fingerprints", () => {
            const input: Parameters<typeof buildFindingFingerprint>[0] = {
              id: "package@1.0.0::production::direct::root>package@1.0.0",
              severity: "high",
              recommendation: "replace",
              license: {
                expression: "MIT OR Apache-2.0",
                choices: ["MIT", "Apache-2.0"],
                joiner: "or",
                signals: ["notice-required", "conflicting-evidence"],
                evidenceSources: ["package.json", "LICENSE"],
                confidence: "high",
                exceptions: ["Classpath-exception-2.0"]
              }
            };
            const reordered: Parameters<typeof buildFindingFingerprint>[0] = {
              ...input,
              license: {
                ...input.license,
                choices: ["Apache-2.0", "MIT", "MIT"],
                signals: ["conflicting-evidence", "notice-required"],
                evidenceSources: ["LICENSE", "package.json"],
                exceptions: ["Classpath-exception-2.0", "Classpath-exception-2.0"]
              }
            };

            expect(buildFindingFingerprint(reordered)).toBe(buildFindingFingerprint(input));
          });

          test("changes finding fingerprints only when risk semantics change", () => {
            const input: Parameters<typeof buildFindingFingerprint>[0] = {
              id: "package@1.0.0::production::direct::root>package@1.0.0",
              severity: "high",
              recommendation: "replace",
              license: {
                expression: "MIT OR Apache-2.0",
                choices: ["MIT", "Apache-2.0"],
                joiner: "or",
                signals: [],
                evidenceSources: ["package.json"],
                confidence: "high",
                exceptions: []
              }
            };
            const changed: Parameters<typeof buildFindingFingerprint>[0] = {
              ...input,
              license: {
                ...input.license,
                expression: "MIT AND Apache-2.0",
                joiner: "and"
              }
            };

            expect(buildFindingFingerprint(changed)).not.toBe(buildFindingFingerprint(input));
          });
          '''
          )

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release gate
        run: bun run verify:release

      - name: Commit verified change
        run: |
          rm .github/workflows/agent-semantic-fingerprints.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/policy/finding-id.ts src/policy/evaluate.ts test/finding-id.test.ts .github/workflows/agent-semantic-fingerprints.yml
          git commit -m "🛡️ fix: make finding fingerprints semantic" -m "Stop diff identity from changing when explanatory prose is edited. Fingerprints now encode normalized license semantics, source provenance, severity, and recommendation using deterministic set ordering." -m "Validation: bun run verify:release"
          git push origin "HEAD:${GITHUB_REF_NAME}"
