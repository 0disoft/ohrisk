name: Finalize semantic finding fingerprints

on:
  push:
    branches:
      - fix/semantic-finding-fingerprints

permissions:
  contents: write

concurrency:
  group: agent-semantic-finding-fingerprints
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Preserve legacy fingerprints and add semantic fingerprints
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          finding_id = Path("src/policy/finding-id.ts")
          finding_id.write_text(textwrap.dedent('''\
          import type { NormalizedLicense } from "../license/types";
          import type { RiskFinding } from "./types";

          export function buildFindingId(input: {
            packageId: string;
            dependencyType: RiskFinding["dependencyType"];
            dependencyScope: RiskFinding["dependencyScope"];
            paths: string[][];
          }): string {
            return joinFindingIdentity(
              input.packageId,
              input.dependencyType,
              input.dependencyScope,
              canonicalPathSet(input.paths)
            );
          }

          // Legacy raw-order identity used only to keep pre-canonicalization waivers
          // matching. Reports, diffs, and new waivers always use buildFindingId.
          export function buildLegacyFindingId(input: {
            packageId: string;
            dependencyType: RiskFinding["dependencyType"];
            dependencyScope: RiskFinding["dependencyScope"];
            paths: string[][];
          }): string {
            return joinFindingIdentity(
              input.packageId,
              input.dependencyType,
              input.dependencyScope,
              input.paths
            );
          }

          function joinFindingIdentity(
            packageId: string,
            dependencyType: RiskFinding["dependencyType"],
            dependencyScope: RiskFinding["dependencyScope"],
            paths: string[][]
          ): string {
            return [
              encodeFindingComponent(packageId),
              encodeFindingComponent(dependencyType),
              encodeFindingComponent(dependencyScope),
              paths.map((items) => items.map(encodeFindingComponent).join(">")).join("|")
            ].join("::");
          }

          function canonicalPathSet(paths: string[][]): string[][] {
            const byKey = new Map<string, string[]>();
            for (const dependencyPath of paths) {
              byKey.set(JSON.stringify(dependencyPath), dependencyPath);
            }

            return [...byKey.values()].sort(comparePaths);
          }

          function comparePaths(left: string[], right: string[]): number {
            const leftKey = left.join("\\u0000");
            const rightKey = right.join("\\u0000");
            if (leftKey < rightKey) {
              return -1;
            }
            if (leftKey > rightKey) {
              return 1;
            }
            return 0;
          }

          export function buildFindingFingerprint(input: {
            id: string;
            severity: RiskFinding["severity"];
            recommendation: RiskFinding["recommendation"];
            reason: string;
            evidence: string[];
          }): string {
            return [
              input.id,
              encodeFindingComponent(input.severity),
              encodeFindingComponent(input.recommendation),
              encodeFindingComponent(input.reason),
              input.evidence.map(encodeFindingComponent).join("|")
            ].join("::");
          }

          export function buildSemanticFindingFingerprint(input: {
            id: string;
            severity: RiskFinding["severity"];
            recommendation: RiskFinding["recommendation"];
            license: Pick<
              NormalizedLicense,
              | "expression"
              | "choices"
              | "joiner"
              | "signals"
              | "evidenceSources"
              | "confidence"
              | "exceptions"
            >;
          }): string {
            const semanticLicense = JSON.stringify({
              expression: input.license.expression ?? null,
              choices: canonicalStringSet(input.license.choices),
              joiner: input.license.joiner,
              signals: canonicalStringSet(input.license.signals),
              evidenceSources: canonicalStringSet(input.license.evidenceSources),
              confidence: input.license.confidence,
              exceptions: canonicalStringSet(input.license.exceptions ?? [])
            });

            return [
              input.id,
              encodeFindingComponent(input.severity),
              encodeFindingComponent(input.recommendation),
              encodeFindingComponent(semanticLicense)
            ].join("::");
          }

          function canonicalStringSet(values: readonly string[]): string[] {
            return [...new Set(values)].sort(compareStrings);
          }

          function compareStrings(left: string, right: string): number {
            if (left < right) {
              return -1;
            }
            if (left > right) {
              return 1;
            }
            return 0;
          }

          function encodeFindingComponent(value: string): string {
            return value
              .replace(/%/g, "%25")
              .replace(/:/g, "%3A")
              .replace(/>/g, "%3E")
              .replace(/\\|/g, "%7C");
          }
          '''), encoding="utf-8")

          evaluate = Path("src/policy/evaluate.ts")
          source = evaluate.read_text(encoding="utf-8")
          source = source.replace(
              'import { buildFindingFingerprint, buildFindingId } from "./finding-id";',
              'import { buildFindingId, buildSemanticFindingFingerprint } from "./finding-id";'
          )
          source, count = re.subn(
              r'  return \{\s*id,\s*fingerprint: buildFindingFingerprint\(\{\s*id,\s*severity,\s*recommendation,\s*license: input\.license\s*\}\),\s*packageId,',
              textwrap.dedent('''\
                return {
                  id,
                  fingerprint: buildSemanticFindingFingerprint({
                    id,
                    severity,
                    recommendation,
                    license: input.license
                  }),
                  packageId,'''),
              source,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"expected one evaluate fingerprint block, found {count}")
          evaluate.write_text(source, encoding="utf-8")

          tests = Path("test/finding-id.test.ts")
          source = tests.read_text(encoding="utf-8")
          source = source.replace(
              '  buildFindingId,\n  buildLegacyFindingId',
              '  buildFindingId,\n  buildLegacyFindingId,\n  buildSemanticFindingFingerprint'
          )
          replacement = textwrap.dedent('''\

            test("escapes fingerprint delimiters inside reason and evidence components", () => {
              const fingerprint = buildFindingFingerprint({
                id: "package@1.0.0::production::direct::root>package@1.0.0",
                severity: "high",
                recommendation: "replace",
                reason: "reason::with>delimiters",
                evidence: ["license: MIT | Apache-2.0", "path > LICENSE"]
              });

              expect(
                fingerprint.startsWith("package@1.0.0::production::direct::root>package@1.0.0::high::replace::")
              ).toBe(true);
              expect(fingerprint).toContain("reason%3A%3Awith%3Edelimiters");
              expect(fingerprint).toContain("license%3A MIT %7C Apache-2.0");
              expect(fingerprint).toContain("path %3E LICENSE");
            });

            test("canonicalizes unordered semantic license facts in finding fingerprints", () => {
              const input: Parameters<typeof buildSemanticFindingFingerprint>[0] = {
                id: "package@1.0.0::production::direct::root>package@1.0.0",
                severity: "high",
                recommendation: "replace",
                license: {
                  expression: "MIT OR Apache-2.0",
                  choices: ["MIT", "Apache-2.0"],
                  joiner: "or",
                  signals: ["metadata-conflict", "notice-required"],
                  evidenceSources: ["package.json", "LICENSE"],
                  confidence: "high",
                  exceptions: ["Classpath-exception-2.0"]
                }
              };
              const reordered: Parameters<typeof buildSemanticFindingFingerprint>[0] = {
                ...input,
                license: {
                  ...input.license,
                  choices: ["Apache-2.0", "MIT", "MIT"],
                  signals: ["notice-required", "metadata-conflict"],
                  evidenceSources: ["LICENSE", "package.json"],
                  exceptions: ["Classpath-exception-2.0", "Classpath-exception-2.0"]
                }
              };

              expect(buildSemanticFindingFingerprint(reordered)).toBe(
                buildSemanticFindingFingerprint(input)
              );
            });

            test("changes finding fingerprints when license semantics change", () => {
              const input: Parameters<typeof buildSemanticFindingFingerprint>[0] = {
                id: "package@1.0.0::production::direct::root>package@1.0.0",
                severity: "high",
                recommendation: "replace",
                license: {
                  expression: "MIT OR Apache-2.0",
                  choices: ["MIT", "Apache-2.0"],
                  joiner: "or",
                  signals: [],
                  evidenceSources: ["package.json"],
                  confidence: "high",
                  exceptions: []
                }
              };
              const changed: Parameters<typeof buildSemanticFindingFingerprint>[0] = {
                ...input,
                license: {
                  ...input.license,
                  expression: "MIT AND Apache-2.0",
                  joiner: "and"
                }
              };

              expect(buildSemanticFindingFingerprint(changed)).not.toBe(
                buildSemanticFindingFingerprint(input)
              );
            });

          ''')
          source, count = re.subn(
              r'\n\s*test\("canonicalizes unordered semantic license facts.*?(?=  test\("keeps finding IDs stable)',
              replacement,
              source,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"expected one semantic fingerprint test block, found {count}")
          tests.write_text(source, encoding="utf-8")

          Path("agent-verification.txt").unlink(missing_ok=True)
          Path("agent-finalize.txt").unlink(missing_ok=True)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release gate
        shell: bash
        run: |
          set +e
          bun run verify:release 2>&1 | tee agent-finalize.txt
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-finalize.txt
          exit "$status"

      - name: Persist failed diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🤖 chore: capture semantic fingerprint diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Commit verified change
        if: success()
        run: |
          rm .github/workflows/agent-semantic-fingerprints.yml
          rm -f agent-finalize.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🛡️ fix: make finding fingerprints semantic" -m "Stop diff identity from changing when explanatory prose is edited. New findings use normalized license semantics while the legacy prose fingerprint remains available for existing waiver compatibility." -m "Validation: bun run verify:release"
          git push origin "HEAD:${GITHUB_REF_NAME}"
