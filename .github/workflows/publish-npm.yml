name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Verify tag and prepare draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_is_draft: ${{ steps.draft_release.outputs.release_is_draft }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Run release verification
        run: bun run verify:release

      - name: Write release notes
        run: bun run release:notes > release-notes.md

      - name: Create or refresh draft GitHub release
        id: draft_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_is_draft="$(
              gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft'
            )"
            if [ "$release_is_draft" = "true" ]; then
              gh release edit "$GITHUB_REF_NAME" \
                --draft \
                --title "$GITHUB_REF_NAME" \
                --notes-file release-notes.md
              echo "release_is_draft=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release ${GITHUB_REF_NAME} is already published."
              echo "release_is_draft=false" >> "$GITHUB_OUTPUT"
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
            echo "release_is_draft=true" >> "$GITHUB_OUTPUT"
          fi

  standalone:
    name: Build standalone executables (${{ matrix.os }})
    needs: prepare_release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: "--target linux-x64 --target linux-arm64"
          - os: macos-latest
            targets: "--target macos-x64 --target macos-arm64"
          - os: windows-latest
            targets: "--target windows-x64 --target windows-arm64"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone executables
        shell: bash
        run: bun scripts/build-standalone.ts ${{ matrix.targets }}

      - name: Upload standalone executables to draft release
        if: needs.prepare_release.outputs.release_is_draft == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release/standalone/ohrisk-*; do
            if [ ! -f "$asset" ]; then
              echo "::error::Standalone asset glob did not resolve to a regular file."
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          done

  publish:
    name: Publish to npm
    needs:
      - prepare_release
      - standalone
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check npm publish state
        id: npm_state
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.npm_state.outputs.already_published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm registry result
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          max_attempts=12
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            package_spec="${package_name}@${package_version}"
            published_version="$(npm view "$package_spec" version 2>/dev/null || true)"
            published_tarball="$(npm view "$package_spec" dist.tarball 2>/dev/null || true)"
            published_integrity="$(npm view "$package_spec" dist.integrity 2>/dev/null || true)"
            if [ "$published_version" = "$package_version" ] \
              && [ -n "$published_tarball" ] \
              && [ -n "$published_integrity" ]; then
              echo "Verified ${package_spec}:"
              echo "  tarball: ${published_tarball}"
              echo "  integrity: ${published_integrity}"
              exit 0
            fi

            echo "npm metadata for ${package_spec} is incomplete or mismatched (version=${published_version:-unavailable}, tarball=${published_tarball:-unavailable}, integrity=${published_integrity:-unavailable}); retrying (${attempt}/${max_attempts})."
            sleep 5
            attempt=$((attempt + 1))
          done

          echo "::error::npm metadata for ${package_spec} did not expose the exact version, tarball, and integrity after ${max_attempts} attempts."
          exit 1

  finalize-release:
    name: Verify assets and publish GitHub release
    needs:
      - prepare_release
      - publish
    if: needs.prepare_release.outputs.release_is_draft == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download and verify standalone release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          assets=(
            ohrisk-linux-arm64
            ohrisk-linux-x64
            ohrisk-macos-arm64
            ohrisk-macos-x64
            ohrisk-windows-arm64.exe
            ohrisk-windows-x64.exe
          )

          for asset in "${assets[@]}"; do
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir release-assets
            if [ ! -f "release-assets/$asset" ]; then
              echo "::error::Draft release is missing standalone asset $asset."
              exit 1
            fi
          done

          (
            cd release-assets
            printf '%s\n' "${assets[@]}" | LC_ALL=C sort | while IFS= read -r asset; do
              sha256sum "$asset"
            done > SHA256SUMS
          )

      - name: Upload checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release-assets/SHA256SUMS \
            --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_is_draft="$(
            gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft'
          )"
          if [ "$release_is_draft" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            echo "Release ${GITHUB_REF_NAME} is already published."
          fi
