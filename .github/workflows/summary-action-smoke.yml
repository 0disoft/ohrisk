name: Summary Action Smoke

on:
  pull_request:
    paths:
      - .github/workflows/summary-action-smoke.yml
      - action-dist/**
      - bin/ohrisk-summary.mjs
      - summary-action/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/summary-action-smoke.yml
      - action-dist/**
      - bin/ohrisk-summary.mjs
      - summary-action/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: summary-action-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  summary-action-smoke:
    name: Generate report and render summary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Generate an Ohrisk JSON report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/summary-action-smoke/project
          printf '%s\n' '{"name":"summary-action-smoke","version":"1.0.0"}' \
            > .tmp/summary-action-smoke/project/package.json
          cd .tmp/summary-action-smoke/project
          node "$GITHUB_WORKSPACE/action-dist/cli.js" scan --json --output report.json

      - name: Render the report summary
        id: summary
        uses: ./summary-action
        with:
          report: .tmp/summary-action-smoke/project/report.json
          max-findings: "5"

      - name: Verify scalar outputs
        shell: bash
        env:
          REPORT_TYPE: ${{ steps.summary.outputs.report-type }}
          FAILED: ${{ steps.summary.outputs.failed }}
          COMPLETENESS: ${{ steps.summary.outputs.completeness }}
          FINDING_COUNT: ${{ steps.summary.outputs.finding-count }}
          HIGH_COUNT: ${{ steps.summary.outputs.high-count }}
        run: |
          set -euo pipefail
          test "$REPORT_TYPE" = "scan"
          test "$FAILED" = "false"
          test "$COMPLETENESS" = "complete"
          test "$FINDING_COUNT" = "0"
          test "$HIGH_COUNT" = "0"
