name: Apply heldout expression semantics

on:
  push:
    branches:
      - fix/heldout-expression-semantics

permissions:
  contents: write

concurrency:
  group: agent-heldout-expression-semantics
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Compare canonical SPDX expression trees
        shell: bash
        run: |
          set +e
          python <<'PY' 2>&1 | tee agent-heldout-patch.txt
          from pathlib import Path
          import re
          import textwrap

          script = Path("scripts/license-heldout.ts")
          source = script.read_text(encoding="utf-8")
          old_import = 'import { collectSpdxLicenseTerms, parseSpdxExpression } from "../src/license/spdx";'
          new_import = 'import { parseSpdxExpression, type SpdxExpressionNode } from "../src/license/spdx";'
          if source.count(old_import) != 1:
              raise SystemExit(f"expected one SPDX import, found {source.count(old_import)}")
          source = source.replace(old_import, new_import)

          source, count = re.subn(
              r'  const ohriskTerms = normalized\.expression\s*\? canonicalLicenseTerms\(\[normalized\.expression\]\)\s*: new Set\(normalized\.choices\);',
              textwrap.dedent('''\
                const ohriskExpressions = canonicalLicenseExpressions(
                  normalized.expression ? [normalized.expression] : normalized.choices
                );'''),
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"expected one Ohrisk expression block, found {count}")

          old_calls = '''      scancode: compareExternalObservation(ohriskTerms, item.external.scancode),
                licensee: compareExternalObservation(ohriskTerms, item.external.licensee)
          '''
          new_calls = '''      scancode: compareExternalObservation(ohriskExpressions, item.external.scancode),
                licensee: compareExternalObservation(ohriskExpressions, item.external.licensee)
          '''
          source, count = re.subn(
              r'      scancode: compareExternalObservation\(ohriskTerms, item\.external\.scancode\),\s*licensee: compareExternalObservation\(ohriskTerms, item\.external\.licensee\)',
              textwrap.dedent(new_calls).rstrip(),
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"expected one external comparison call block, found {count}")

          helpers = textwrap.dedent('''\
          function compareExternalObservation(
            ohriskExpressions: ReadonlySet<string>,
            observation: ExternalLicenseToolObservation
          ): ExternalLicenseToolComparison {
            const expressions = observation.expressions ?? [];
            const common = {
              observedStatus: observation.status,
              expressions,
              ...(observation.version ? { version: observation.version } : {}),
              ...(observation.note ? { note: observation.note } : {})
            };
            if (observation.status === "not-run" || observation.status === "error") {
              return { status: "unavailable", ...common };
            }

            const externalExpressions = canonicalLicenseExpressions(expressions);
            const agrees = observation.status === "no-detection"
              ? ohriskExpressions.size === 0
              : setEquals(ohriskExpressions, externalExpressions);
            return { status: agrees ? "agree" : "disagree", ...common };
          }

          function canonicalLicenseExpressions(expressions: readonly string[]): Set<string> {
            const canonical = new Set<string>();
            for (const expression of expressions) {
              const parsed = parseSpdxExpression(expression);
              if (parsed.malformed || !parsed.ast) {
                const raw = expression.trim();
                if (raw) {
                  canonical.add(`raw:${raw}`);
                }
                continue;
              }
              canonical.add(canonicalSpdxExpression(parsed.ast));
            }
            return canonical;
          }

          function canonicalSpdxExpression(ast: SpdxExpressionNode): string {
            if (ast.type === "license") {
              return ast.exception
                ? `license:${ast.license} WITH ${ast.exception}`
                : `license:${ast.license}`;
            }

            const operands = flattenSpdxOperator(ast, ast.type)
              .map(canonicalSpdxExpression)
              .sort(compareStrings);
            return `${ast.type}:[${operands.join(",")}]`;
          }

          function flattenSpdxOperator(
            ast: SpdxExpressionNode,
            operator: "and" | "or"
          ): SpdxExpressionNode[] {
            if (ast.type !== operator) {
              return [ast];
            }
            return [
              ...flattenSpdxOperator(ast.left, operator),
              ...flattenSpdxOperator(ast.right, operator)
            ];
          }

          function compareStrings(left: string, right: string): number {
            if (left < right) {
              return -1;
            }
            if (left > right) {
              return 1;
            }
            return 0;
          }

          ''')
          source, count = re.subn(
              r'function compareExternalObservation\(.*?(?=function setEquals)',
              helpers,
              source,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"expected one external comparison helper range, found {count}")
          script.write_text("\n".join(line.rstrip() for line in source.splitlines()) + "\n", encoding="utf-8")

          tests = Path("test/license-heldout.test.ts")
          source = tests.read_text(encoding="utf-8")
          test_block = textwrap.dedent('''\

            test("distinguishes SPDX AND from OR when the license terms match", () => {
              const result = evaluateHeldoutLicenseCases([
                heldoutCase({
                  id: "operator-mismatch",
                  license: "MIT AND Apache-2.0",
                  expected: { severity: "low", confidence: "high" },
                  scancode: { status: "detected", expressions: ["MIT OR Apache-2.0"] },
                  licensee: { status: "detected", expressions: ["Apache-2.0 AND MIT"] }
                })
              ]);

              expect(result.evaluations[0]?.external).toMatchObject({
                scancode: { status: "disagree" },
                licensee: { status: "agree" }
              });
            });
          ''')
          marker = '\n  test("does not collapse SPDX exceptions into their base license"'
          if source.count(marker) != 1:
              raise SystemExit(f"expected one exception test marker, found {source.count(marker)}")
          source = source.replace(marker, test_block + marker)
          tests.write_text("\n".join(line.rstrip() for line in source.splitlines()) + "\n", encoding="utf-8")
          PY
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-heldout-patch.txt
          exit "$status"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release gate
        shell: bash
        run: |
          set +e
          bun run verify:release 2>&1 | tee agent-heldout-verify.txt
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-heldout-verify.txt
          exit "$status"

      - name: Persist failed diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🤖 chore: capture heldout expression diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Commit verified change
        if: success()
        run: |
          rm .github/workflows/agent-heldout-expression-semantics.yml
          rm -f agent-heldout-patch.txt agent-heldout-verify.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🧪 test: compare heldout SPDX expression semantics" -m "Compare canonical SPDX expression trees instead of flattening detections into license-term sets. Reordered equivalent expressions still agree, while AND, OR, grouping, and exceptions remain distinct." -m "Validation: bun run verify:release"
          git push origin "HEAD:${GITHUB_REF_NAME}"
