name: Finalize baseline policy isolation

on:
  push:
    branches:
      - fix/diff-baseline-policy

permissions:
  contents: write

concurrency:
  group: agent-diff-baseline-policy
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Wire baseline policy into diff
        shell: bash
        run: |
          set +e
          python <<'PY' 2>&1 | tee agent-policy-patch.txt
          from pathlib import Path
          import textwrap

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return source.replace(old, new)

          main_path = Path("src/cli/main.ts")
          source = main_path.read_text(encoding="utf-8")
          if 'from "../policy/ref-config";' not in source:
              source = replace_once(
                  source,
                  'import { hasFindingAtOrAbove } from "../policy/severity";\n',
                  'import { readPolicyConfigFromRef } from "../policy/ref-config";\nimport { hasFindingAtOrAbove } from "../policy/severity";\n',
                  "baseline policy import"
              )

          run_start = source.index("async function runDiff(")
          run_end = source.index("async function runExplain(", run_start)
          run = source[run_start:run_end]

          if "const baselinePolicy = readPolicyConfigFromRef" not in run:
              marker = '  const evidenceRuntime = resolveEvidenceRuntimeOptions({\n'
              insertion = '''  const readRefFile = io.readRefFile ?? readGitRefFile;
              const baselinePolicy = readPolicyConfigFromRef({
                projectRoot: currentProject.value.rootDir,
                ...(workspaceRoot.value ? { workspaceRoot: workspaceRoot.value } : {}),
                ref: command.baselineRef,
                readRefFile,
                ...(command.policyPath ? { policyPath: command.policyPath } : {})
              });
              if (isErr(baselinePolicy)) {
                io.stderr(formatError(baselinePolicy.error));
                return exitCodeForError(baselinePolicy.error);
              }

              '''
              run = replace_once(run, marker, insertion + marker, "baseline policy load")

          duplicate_reader = '  const readRefFile = io.readRefFile ?? readGitRefFile;\n  const listRefFiles = io.listRefFiles ?? listGitRefFiles;\n'
          if run.count(duplicate_reader) == 1:
              run = run.replace(
                  duplicate_reader,
                  '  const listRefFiles = io.listRefFiles ?? listGitRefFiles;\n'
              )

          if "const baselineEvidenceRuntime = resolveEvidenceRuntimeOptions" not in run:
              fetch_marker = '  const fetchRemoteMavenPoms = ('
              baseline_runtime = '''  const baselineEvidenceRuntime = resolveEvidenceRuntimeOptions({
                cwd: io.cwd,
                projectRoot: currentProject.value.rootDir,
                policy: baselinePolicy.value,
                offline: command.offline ?? false,
                ...(command.cacheDir ? { cacheDir: command.cacheDir } : {}),
                ...(command.jobs !== undefined ? { jobs: command.jobs } : {}),
                ...(command.timeoutMs !== undefined ? { timeoutMs: command.timeoutMs } : {}),
                ...(command.registryUrl ? { registryUrl: command.registryUrl } : {}),
                ...(command.registryTokenEnv ? { registryTokenEnv: command.registryTokenEnv } : {}),
                allowedHosts: command.allowedHosts ?? [],
                env: io.env ?? process.env
              });
              if (isErr(baselineEvidenceRuntime)) {
                io.stderr(formatError(baselineEvidenceRuntime.error));
                return exitCodeForError(baselineEvidenceRuntime.error);
              }

              '''
              run = replace_once(
                  run,
                  fetch_marker,
                  baseline_runtime + fetch_marker,
                  "baseline evidence runtime"
              )

          if "const fetchBaselineRemoteMavenPoms" not in run:
              current_graph_marker = '  const currentGraph = await parseProjectDependencyGraphWithRemoteMavenPoms({\n'
              baseline_fetcher = '''  const fetchBaselineRemoteMavenPoms = (
                requests: Parameters<typeof fetchMavenCentralModelPoms>[0]["requests"]
              ) => fetchMavenCentralModelPoms({
                requests,
                offline: baselineEvidenceRuntime.value.offline,
                signal,
                ...(baselineEvidenceRuntime.value.timeoutMs === undefined
                  ? {}
                  : { fetchTimeoutMs: baselineEvidenceRuntime.value.timeoutMs }),
                ...(baselineEvidenceRuntime.value.cacheDir === undefined
                  ? {}
                  : { cacheDir: baselineEvidenceRuntime.value.cacheDir })
              });
              '''
              run = replace_once(
                  run,
                  current_graph_marker,
                  baseline_fetcher + current_graph_marker,
                  "baseline Maven fetcher"
              )

          baseline_start = run.index("  const baselineProject = await resolveWithRemoteMavenPoms({")
          baseline_end = run.index("  if (isErr(baselineProject))", baseline_start)
          baseline_block = run[baseline_start:baseline_end]
          baseline_block = replace_once(
              baseline_block,
              '    fetchRemotePoms: fetchRemoteMavenPoms\n',
              '    fetchRemotePoms: fetchBaselineRemoteMavenPoms\n',
              "baseline Maven policy"
          )
          run = run[:baseline_start] + baseline_block + run[baseline_end:]

          evidence_start = run.index("  const baselineEvidence = await collectEvidenceForGraph({")
          evidence_end = run.index("  if (isErr(baselineEvidence))", evidence_start)
          evidence_block = run[evidence_start:evidence_end]
          evidence_block = replace_once(
              evidence_block,
              '    evidenceRuntime: evidenceRuntime.value,\n',
              '    evidenceRuntime: baselineEvidenceRuntime.value,\n',
              "baseline evidence policy"
          )
          run = run[:evidence_start] + evidence_block + run[evidence_end:]

          finding_start = run.index("  const baselineFindings = evaluateLicenseRisks({")
          finding_end = run.index("  const current = await evaluateProjectScan({", finding_start)
          finding_block = run[finding_start:finding_end]
          finding_block = replace_once(
              finding_block,
              '    policy: policy.value\n',
              '    policy: baselinePolicy.value\n',
              "baseline risk policy"
          )
          run = run[:finding_start] + finding_block + run[finding_end:]

          source = source[:run_start] + run + source[run_end:]
          main_path.write_text("\n".join(line.rstrip() for line in source.splitlines()) + "\n", encoding="utf-8")

          tests_path = Path("test/main.test.ts")
          tests = tests_path.read_text(encoding="utf-8")
          if "evaluates baseline findings with the policy stored in the baseline ref" not in tests:
              marker = '  test("does not apply local waivers to git ref diff findings", async () => {\n'
              test_case = textwrap.dedent(r'''
                test("evaluates baseline findings with the policy stored in the baseline ref", async () => {
                  const projectRoot = mkdtempSync(path.join(tmpdir(), "ohrisk-baseline-policy-diff-"));

                  try {
                    cpSync(path.join(fixturesDir, "bun-project"), projectRoot, { recursive: true });
                    writeFileSync(
                      path.join(projectRoot, ".ohrisk.yml"),
                      [
                        "version: 1",
                        "packages:",
                        "  'agpl-child@0.1.0':",
                        "    severity: low",
                        "    recommendation: allow"
                      ].join("\n") + "\n",
                      "utf8"
                    );

                    const { io, stdout, stderr } = createTestIO(projectRoot);
                    Object.assign(io, createBaselineSnapshotIO(projectRoot, {
                      ".ohrisk.yml": "version: 1\n"
                    }));

                    const exitCode = await main(["diff", "main", "--prod", "--json"], io);

                    expect(exitCode).toBe(0);
                    expect(stderr).toEqual([]);
                    const payload = JSON.parse(stdout.join("\n")) as {
                      changedFindingCount: number;
                      changedFindings: Array<{
                        packageId: string;
                        previousSeverity: string;
                        severity: string;
                      }>;
                    };
                    expect(payload.changedFindingCount).toBe(1);
                    expect(payload.changedFindings).toContainEqual(expect.objectContaining({
                      packageId: "agpl-child@0.1.0",
                      previousSeverity: "high",
                      severity: "low"
                    }));
                  } finally {
                    rmSync(projectRoot, { recursive: true, force: true });
                  }
                });

              ''')
              tests = replace_once(
                  tests,
                  marker,
                  test_case + marker,
                  "baseline policy integration test"
              )
              tests_path.write_text("\n".join(line.rstrip() for line in tests.splitlines()) + "\n", encoding="utf-8")

          for file_name in (
              "agent-policy-patch.txt",
              "agent-policy-build.txt",
              "agent-policy-verify.txt",
          ):
              Path(file_name).unlink(missing_ok=True)
          PY
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-policy-patch.txt
          exit "$status"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild checked-in Action bundle
        shell: bash
        run: |
          set +e
          bun run build:action 2>&1 | tee agent-policy-build.txt
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-policy-build.txt
          exit "$status"

      - name: Verify release gate
        shell: bash
        run: |
          set +e
          bun run verify:release 2>&1 | tee agent-policy-verify.txt
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-policy-verify.txt
          exit "$status"

      - name: Persist failed diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🤖 chore: capture baseline policy diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Commit verified change
        if: success()
        run: |
          rm .github/workflows/agent-diff-baseline-policy.yml
          rm -f agent-policy-patch.txt agent-policy-build.txt agent-policy-verify.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🛡️ fix: evaluate baseline with its own policy" -m "Load .ohrisk.yml and inherited policy files from the selected git ref. Use the baseline policy for baseline registry access, evidence collection, and risk evaluation so current policy edits cannot rewrite historical findings." -m "Validation: bun run verify:release"
          git push origin "HEAD:${GITHUB_REF_NAME}"
