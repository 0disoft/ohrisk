name: Finalize archive same-root auto merge

on:
  push:
    branches:
      - fix/archive-auto-merge-same-root

permissions:
  contents: write

concurrency:
  group: agent-archive-auto-merge-same-root
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Apply archive auto-merge fix
        shell: bash
        run: |
          set +e
          rm -f agent-archive-patch.txt agent-archive-build.txt agent-archive-test.txt
          rm -f agent-archive-live.txt agent-archive-verify.txt
          python <<'PY' 2>&1 | tee agent-archive-patch.txt
          from pathlib import Path
          import textwrap

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return source.replace(old, new)

          main_path = Path("src/cli/main.ts")
          source = main_path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '    ...(input.repository ? { autoMergeSameRoot: true } : {}),\n',
              '    ...(input.repository || command.archivePath ? { autoMergeSameRoot: true } : {}),\n',
              "scan input auto merge"
          )
          source = replace_once(
              source,
              '      allLockfiles: input.allLockfiles,\n      prodOnly: input.prodOnly,\n',
              '      allLockfiles: input.allLockfiles,\n      autoMergeSameRoot: input.autoMergeSameRoot ?? false,\n      prodOnly: input.prodOnly,\n',
              "archive loader call"
          )
          source = replace_once(
              source,
              '  allLockfiles: boolean;\n  prodOnly: boolean;\n',
              '  allLockfiles: boolean;\n  autoMergeSameRoot: boolean;\n  prodOnly: boolean;\n',
              "archive loader input"
          )
          source = replace_once(
              source,
              '  const loaded = loadArchiveProject({\n    source: archive.value,\n    allLockfiles: input.allLockfiles\n  });\n',
              '  const loaded = loadArchiveProject({\n    source: archive.value,\n    allLockfiles: input.allLockfiles || input.autoMergeSameRoot\n  });\n',
              "archive project selection"
          )
          main_path.write_text(source, encoding="utf-8")

          Path("test/archive-cli-auto-merge.test.ts").write_text(textwrap.dedent('''\
          import { describe, expect, test } from "bun:test";
          import { mkdtempSync, rmSync, writeFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import path from "node:path";

          import { main, type CliIO } from "../src/cli/main";
          import { createTarGz } from "./helpers/tar";

          describe("archive CLI project discovery", () => {
            test("automatically merges supported lockfiles at one archive project root", async () => {
              const projectRoot = mkdtempSync(path.join(tmpdir(), "ohrisk-archive-auto-merge-"));
              const archivePath = path.join(projectRoot, "repository.tar.gz");

              try {
                writeFileSync(archivePath, createTarGz({
                  "archive-app/Cargo.toml": [
                    "[package]",
                    'name = "archive-app"',
                    'version = "0.1.0"',
                    'edition = "2024"'
                  ].join("\\n") + "\\n",
                  "archive-app/Cargo.lock": [
                    "version = 3",
                    "",
                    "[[package]]",
                    'name = "archive-app"',
                    'version = "0.1.0"'
                  ].join("\\n") + "\\n",
                  "archive-app/package.json": JSON.stringify({
                    name: "archive-app",
                    version: "0.1.0"
                  }),
                  "archive-app/package-lock.json": JSON.stringify({
                    name: "archive-app",
                    version: "0.1.0",
                    lockfileVersion: 3,
                    packages: {
                      "": {
                        name: "archive-app",
                        version: "0.1.0"
                      }
                    }
                  })
                }));

                const stdout: string[] = [];
                const stderr: string[] = [];
                const io: CliIO = {
                  cwd: projectRoot,
                  stdout: (text) => stdout.push(text),
                  stderr: (text) => stderr.push(text)
                };
                const exitCode = await main([
                  "scan",
                  "--html",
                  "--archive",
                  archivePath,
                  "--offline"
                ], io);

                expect(exitCode).toBe(0);
                expect(stderr).toEqual([]);
                const html = stdout.join("\\n");
                expect(html.toLowerCase()).toContain("<!doctype html");
                expect(html).toContain("Cargo.lock");
                expect(html).toContain("package-lock.json");
              } finally {
                rmSync(projectRoot, { force: true, recursive: true });
              }
            });
          });
          '''), encoding="utf-8")
          PY
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-archive-patch.txt
          exit "$status"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild checked-in Action bundle
        shell: bash
        run: |
          set +e
          bun run build:action 2>&1 | tee agent-archive-build.txt
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-archive-build.txt
          exit "$status"

      - name: Run focused regression test
        shell: bash
        run: |
          set +e
          bun test test/archive-cli-auto-merge.test.ts 2>&1 | tee agent-archive-test.txt
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-archive-test.txt
          exit "$status"

      - name: Recheck the failing public archive
        shell: bash
        run: |
          set +e
          archive=/tmp/melody-main.tar.gz
          report=/tmp/melody-ohrisk.html
          stderr=/tmp/melody-ohrisk.stderr
          curl --fail --location --silent --show-error \
            --max-time 120 \
            --output "$archive" \
            https://github.com/yoav-lavi/melody/archive/refs/heads/main.tar.gz
          download_status=$?
          if [ "$download_status" -ne 0 ]; then
            echo "download_exit_status=$download_status" | tee agent-archive-live.txt
            exit "$download_status"
          fi
          bun src/cli/main.ts scan --html --archive "$archive" >"$report" 2>"$stderr"
          scan_status=$?
          {
            echo "scan_exit_status=$scan_status"
            echo "report_bytes=$(wc -c < "$report")"
            echo "stderr:"
            cat "$stderr"
          } | tee agent-archive-live.txt
          if [ "$scan_status" -ne 0 ]; then
            exit "$scan_status"
          fi
          grep -qi '<html' "$report" || exit 1
          grep -q 'Cargo.lock' "$report" || exit 1
          grep -q 'flake.lock' "$report" || exit 1

      - name: Verify release gate
        shell: bash
        run: |
          set +e
          bun run verify:release 2>&1 | tee agent-archive-verify.txt
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-archive-verify.txt
          exit "$status"

      - name: Persist failed diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🤖 chore: capture archive auto-merge diagnostics" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Commit verified change
        if: success()
        run: |
          rm .github/workflows/agent-archive-auto-merge.yml
          rm -f agent-archive-patch.txt agent-archive-build.txt agent-archive-test.txt
          rm -f agent-archive-live.txt agent-archive-verify.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🐛 fix: auto-merge same-root archive inputs" \
            -m "Make archive scans use the same deterministic same-root input merging as public repository URL scans. Archives with multiple supported lockfiles no longer fail unless they contain independent project roots." \
            -m "Validation: focused archive HTML regression, live yoav-lavi/melody tar.gz scan, and bun run verify:release"
          git push origin "HEAD:${GITHUB_REF_NAME}"
