name: Finalize diff evidence completeness gate

on:
  push:
    branches:
      - fix/diff-evidence-completeness

permissions:
  contents: write

concurrency:
  group: agent-diff-evidence-completeness
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Repair generated sources
        shell: python
        run: |
          from pathlib import Path

          for file_name in (
              "src/cli/diff-completeness.ts",
              "test/diff-completeness.test.ts",
          ):
              path = Path(file_name)
              source = path.read_text(encoding="utf-8")
              if source.startswith("\\\n"):
                  source = source[2:]
              path.write_text(source, encoding="utf-8")

          main = Path("src/cli/main.ts")
          source = main.read_text(encoding="utf-8")
          old_diff = '''const completeness = buildDiffEvidenceCompleteness({
            baseline: buildScanCompleteness({ evidence: relevantBaselineEvidence }),
            current: buildScanCompleteness({ evidence: current.value.evidence })
          });
          const diff = diffRiskFindings({
            baselineFindings,
            currentFindings: current.value.riskFindings
          });'''
          new_diff = '''  const completeness = buildDiffEvidenceCompleteness({
            baseline: buildScanCompleteness({ evidence: relevantBaselineEvidence }),
            current: buildScanCompleteness({ evidence: current.value.evidence })
          });
          const diff = diffRiskFindings({
            baselineFindings,
            currentFindings: current.value.riskFindings
          });'''
          if source.count(old_diff) != 1:
              raise SystemExit(f"expected one unindented diff block, found {source.count(old_diff)}")
          source = source.replace(old_diff, new_diff)

          old_gate = '''if (completeness.status === "partial") {
            io.stderr(renderIncompleteDiffEvidence(completeness));
            return 1;
          }

          if (command.failOn && hasFindingAtOrAbove(diff.introducedFindings, command.failOn)) {
            return 1;
          }'''
          new_gate = '''  if (completeness.status === "partial") {
            io.stderr(renderIncompleteDiffEvidence(completeness));
            return 1;
          }

          if (command.failOn && hasFindingAtOrAbove(diff.introducedFindings, command.failOn)) {
            return 1;
          }'''
          if source.count(old_gate) != 1:
              raise SystemExit(f"expected one unindented gate block, found {source.count(old_gate)}")
          main.write_text(source.replace(old_gate, new_gate), encoding="utf-8")

          for file_name in (
              "agent-diff-patch.txt",
              "agent-diff-build.txt",
              "agent-diff-verify.txt",
          ):
              Path(file_name).unlink(missing_ok=True)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild checked-in Action bundle
        shell: bash
        run: |
          set +e
          bun run build:action 2>&1 | tee agent-diff-build.txt
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-diff-build.txt
          exit "$status"

      - name: Verify release gate
        shell: bash
        run: |
          set +e
          bun run verify:release 2>&1 | tee agent-diff-verify.txt
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> agent-diff-verify.txt
          exit "$status"

      - name: Persist failed diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🤖 chore: capture diff completeness diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Commit verified change
        if: success()
        run: |
          rm .github/workflows/agent-diff-completeness.yml
          rm -f agent-diff-patch.txt agent-diff-build.txt agent-diff-verify.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🛡️ fix: fail diff on partial evidence" -m "Evaluate baseline and current scan completeness before accepting a diff. Emit an explicit indeterminate warning and return non-zero whenever either revision contains unavailable evidence." -m "Validation: bun run verify:release"
          git push origin "HEAD:${GITHUB_REF_NAME}"
