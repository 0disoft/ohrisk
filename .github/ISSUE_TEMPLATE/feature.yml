name: Feature request
description: Propose a focused change to Ohrisk behavior or ecosystem coverage.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user decision that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include command shape, inputs, output, and failure behavior when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example inputs or public references
  - type: textarea
    id: boundaries
    attributes:
      label: Compatibility and security considerations
      description: Note trust boundaries, migration needs, or unsupported cases.
