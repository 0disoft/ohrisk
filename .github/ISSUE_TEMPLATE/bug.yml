name: Bug report
description: Report a reproducible Ohrisk behavior that is not a license classification disagreement.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include secrets or private dependency data. Report vulnerabilities through the private security form.
  - type: input
    id: version
    attributes:
      label: Ohrisk version
      placeholder: Output of ohrisk --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Operating system, shell, Node version, and package manager
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a public repository or a minimal redacted fixture when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error code and sanitized output.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
