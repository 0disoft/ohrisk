[install]
exact = true
linker = "isolated"

[test]
coverageDir = "coverage"
# The project gate enforces global 82% line and 90% function coverage in
# scripts/check-coverage.ts. Bun's threshold is per file, so it is not used here.
coveragePathIgnorePatterns = [
  "src/report/locales/**",
  "src/types/**"
]
